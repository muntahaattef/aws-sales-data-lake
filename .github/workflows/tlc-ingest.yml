name: NYC taxi ingestion
on:
  schedule:
    - cron: '23 9 * * 2'
  workflow_dispatch:
    inputs:
      month:
        description: 'First release month (YYYY-MM-01)'
        required: true
      through:
        description: 'Last release month (YYYY-MM-01), optional'
      publish:
        description: 'Publish to S3 and verify with Athena'
        type: boolean
        default: false

concurrency:
  group: tlc-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name == 'workflow_dispatch' || vars.TLC_AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
      FIRST_MONTH: ${{ inputs.month }}
      LAST_MONTH: ${{ inputs.through }}
      BUCKET: ${{ vars.TLC_BUCKET }}
      PREFIX: ${{ vars.TLC_PREFIX || 'tlc-yellow' }}
      RESULTS_S3: ${{ vars.TLC_ATHENA_RESULTS }}
      WORKGROUP: ${{ vars.TLC_ATHENA_WORKGROUP || 'primary' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install .
      - if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TLC_AWS_ROLE_ARN }}
          aws-region: ${{ vars.TLC_AWS_REGION }}
      - name: Load and reconcile releases
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$FIRST_MONTH" ]]; then args+=(--month "$FIRST_MONTH"); fi
          if [[ -n "$LAST_MONTH" ]]; then args+=(--through "$LAST_MONTH"); fi
          if [[ "$PUBLISH" == true ]]; then
            : "${BUCKET:?Set TLC_BUCKET}" "${RESULTS_S3:?Set TLC_ATHENA_RESULTS}"
            args+=(--bucket "$BUCKET" --prefix "$PREFIX" --results-s3 "$RESULTS_S3" --workgroup "$WORKGROUP")
          fi
          python scripts/tlc_ingest.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tlc-ingestion-metrics
          path: tlc-output/*/metrics.json
          if-no-files-found: ignore
